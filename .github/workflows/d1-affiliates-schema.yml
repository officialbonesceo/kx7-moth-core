name: d1-affiliates-schema
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wrangler
        run: npm i -g wrangler@3
      - name: Apply affiliates schema to lanecash-db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          wrangler d1 execute lanecash-db --remote --file=ops/pulse-a/schema-affiliates.sql
          echo "--- verify ---"
          wrangler d1 execute lanecash-db --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('affiliates','affiliate_hints');"
