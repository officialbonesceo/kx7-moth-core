name: notify

on:
  schedule:
    # Thrice daily (UTC): 07:00, 13:00, 19:00 ≈ 08:00 / 14:00 / 20:00 WAT
    - cron: "0 7,13,19 * * *"
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      title:
        description: Notification title
        default: LaneCash
      body:
        description: Notification body
        default: New practical money update on LaneCash
      url:
        description: Open path
        default: /

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install web-push
        run: npm install web-push@3
      - name: send
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          TITLE="${{ inputs.title || 'LaneCash' }}"
          BODY="${{ inputs.body || 'Fresh money tip — open LaneCash for today's guide.' }}"
          URL="${{ inputs.url || '/' }}"
          node ops/notify/send.mjs "$TITLE" "$BODY" "$URL"
