name: notify

on:
  workflow_dispatch:
    inputs:
      title:
        description: Notification title
        default: LaneCash
      body:
        description: Notification body
        default: New practical money update
      url:
        description: Open path
        default: /

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install web-push
        run: npm install web-push@3
      - name: send
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node ops/notify/send.mjs "${{ inputs.title }}" "${{ inputs.body }}" "${{ inputs.url }}"
