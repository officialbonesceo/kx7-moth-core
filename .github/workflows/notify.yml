name: notify

on:
  schedule:
    # Thrice daily (UTC): 07:00, 13:00, 19:00 ≈ 08:00 / 14:00 / 20:00 WAT
    - cron: "0 7,13,19 * * *"
  workflow_dispatch:
    inputs:
      title:
        description: Notification title
        required: false
        default: LaneCash
      body:
        description: Notification body
        required: false
        default: Fresh money tip — open LaneCash for today's guide.
      url:
        description: Open path
        required: false
        default: /

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install web-push
        run: npm install web-push@3
      - name: send
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          NOTIFY_TITLE: ${{ inputs.title }}
          NOTIFY_BODY: ${{ inputs.body }}
          NOTIFY_URL: ${{ inputs.url }}
        run: |
          TITLE="${NOTIFY_TITLE:-LaneCash}"
          BODY="${NOTIFY_BODY:-Fresh money tip — open LaneCash for today's guide.}"
          URL="${NOTIFY_URL:-/}"
          node ops/notify/send.mjs "$TITLE" "$BODY" "$URL"
