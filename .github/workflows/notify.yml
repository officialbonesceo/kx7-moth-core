name: notify

on:
  schedule:
    - cron: "0 7,13,19 * * *"
  workflow_dispatch:
    inputs:
      title:
        description: Notification title
        required: false
        default: LaneCash
      body:
        description: Notification body
        required: false
        default: New practical money update on LaneCash
      url:
        description: Open path
        required: false
        default: /

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install web-push
        run: npm install web-push@3
      - name: send
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NOTIFY_TITLE: ${{ inputs.title }}
          NOTIFY_BODY: ${{ inputs.body }}
          NOTIFY_URL: ${{ inputs.url }}
        run: |
          set -e
          TITLE=${NOTIFY_TITLE:-LaneCash}
          BODY=${NOTIFY_BODY:-New practical money update on LaneCash}
          URL=${NOTIFY_URL:-/}
          echo "notify title=$TITLE url=$URL"
          node ops/notify/send.mjs "$TITLE" "$BODY" "$URL"
