name: seed-fix
on:
  workflow_dispatch:
  push:
    paths:
      - 'ops/seed/seed-fix-quality.ts'
      - '.github/workflows/seed-fix.yml'
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: fix remote work + add 2 articles
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: npx tsx ops/seed/seed-fix-quality.ts
